# GitHub Profile 3D Contribution — workflow đã chuẩn bị sẵn
# Nguồn: README của yoshi389111/github-profile-3d-contrib (đọc kĩ 08/11/2026)
# Mẫu theo snake workflow đã chạy tốt trên repo này (daily 00:00 UTC + chạy tay).
#
# CÁCH ÁP DỤNG (3 bước):
#   1. Đặt file này vào repo profile: .github/workflows/profile-3d.yml
#      (GitHub API KHÔNG ghi được workflow — phải đi qua web UI, dùng Upload file,
#      giống cách đã làm với snake.yml.)
#   2. Chạy tay lần đầu: tab Actions → "GitHub-Profile-3D-Contrib" → Run workflow.
#      (SVG chỉ có SAU lần chạy đầu — trước đó chưa có file để nhúng.)
#   3. Thêm vào README, đặt sau mục Snake (hoặc thay chỗ Snake nếu muốn gọn):
#        ![3D Contribution](profile-3d-contrib/profile-green-animate.svg)
#      Các SVG khác có sẵn trong thư mục profile-3d-contrib/:
#        profile-green.svg, profile-green-animate.svg, profile-season-animate.svg,
#        profile-night-green.svg, profile-night-green-animate.svg,
#        profile-night-rainbow.svg, profile-gitblock.svg, profile-south-season-animate.svg,
#        profile-north-season-animate.svg, profile-radar.svg
#
# LƯU Ý:
# - KHÔNG cần secret: GITHUB_TOKEN mặc định đủ cho repo public (PAT chỉ cần
#   khi muốn tính cả contribution ở repo private — Nguyên KHÔNG cần).
# - README gốc đề xuất cron 18:00 UTC; file này dùng 00:00 UTC cho khớp snake.
#   Đổi giờ tùy ý, vẫn chạy được.
# - Workflow tự commit SVG lên main bằng GITHUB_TOKEN (giống snake).
# - Lần commit đầu sẽ là "chore: update 3D contribution profile" (git-auto-commit
#   không dùng ở đây; dùng lệnh git trực tiếp như README gốc).

name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 0 * * *" # Chạy hằng ngày lúc 00:00 UTC (07:00 giờ VN), khớp snake
  workflow_dispatch: # Cho phép chạy tay lần đầu

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib
          if git commit -m "chore: update 3D contribution profile"; then
            git push
          fi
